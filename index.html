<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>OS Anderson</title>
  <style>
    :root{
      --bg:#f3f5f8;
      --card:#ffffff;
      --text:#101828;
      --muted:#667085;
      --line:#e4e7ec;
      --blue:#003b73;
      --blue2:#07569f;
      --green:#039855;
      --orange:#f79009;
      --red:#d92d20;
      --shadow:0 8px 24px rgba(16,24,40,.08);
      --radius:18px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:var(--bg);
      color:var(--text);
      padding-bottom:84px;
    }

    header{
      position:sticky;
      top:0;
      z-index:10;
      background:linear-gradient(135deg,#06182f,#003b73);
      color:white;
      padding:14px 14px 16px;
      box-shadow:0 8px 24px rgba(0,0,0,.18);
    }

    .top{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .logo{
      width:48px;
      height:48px;
      border-radius:14px;
      background:white;
      display:grid;
      place-items:center;
      overflow:hidden;
      flex:none;
    }

    .logo img{
      width:100%;
      height:100%;
      object-fit:contain;
      padding:4px;
      display:none;
    }

    .logo span{
      color:var(--blue);
      font-size:24px;
      font-weight:900;
    }

    h1{
      margin:0;
      font-size:19px;
      line-height:1.05;
    }

    .sub{
      margin:3px 0 0;
      font-size:12px;
      color:#d6e7ff;
    }

    main{
      padding:14px;
      max-width:760px;
      margin:0 auto;
    }

    .screen{display:none}
    .screen.active{display:block}

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:14px;
      margin-bottom:12px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-bottom:12px;
    }

    .metric{
      background:white;
      border:1px solid var(--line);
      border-radius:16px;
      box-shadow:var(--shadow);
      padding:13px;
    }

    .metric .label{
      font-size:12px;
      color:var(--muted);
      font-weight:700;
      margin-bottom:7px;
    }

    .metric .value{
      font-size:20px;
      font-weight:900;
      letter-spacing:-.4px;
    }

    .metric.full{
      grid-column:1/-1;
    }

    .title-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }

    h2{
      margin:0;
      font-size:18px;
    }

    .muted{
      color:var(--muted);
      font-size:13px;
    }

    input, select, textarea{
      width:100%;
      border:1px solid #d0d5dd;
      border-radius:14px;
      padding:12px;
      font-size:16px;
      outline:none;
      background:white;
    }

    textarea{
      min-height:92px;
      resize:vertical;
    }

    label{
      display:block;
      font-size:13px;
      color:#344054;
      font-weight:800;
      margin:10px 0 6px;
    }

    .row2{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .btn{
      border:0;
      border-radius:14px;
      padding:12px 14px;
      font-weight:900;
      cursor:pointer;
      background:var(--blue);
      color:white;
      font-size:15px;
      min-height:44px;
    }

    .btn:active{transform:scale(.98)}
    .btn.green{background:var(--green)}
    .btn.orange{background:var(--orange);color:#111827}
    .btn.red{background:var(--red)}
    .btn.gray{background:#475467}
    .btn.light{background:#eef4ff;color:var(--blue)}
    .btn.block{width:100%}
    .btn.small{font-size:13px;min-height:36px;padding:8px 10px;border-radius:12px}

    .actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:10px;
    }

    .os-card{
      background:white;
      border:1px solid var(--line);
      border-radius:17px;
      padding:13px;
      margin-bottom:10px;
      box-shadow:0 6px 18px rgba(16,24,40,.06);
    }

    .os-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }

    .os-num{
      font-size:12px;
      font-weight:900;
      color:var(--muted);
    }

    .client{
      font-size:17px;
      font-weight:900;
      margin-top:3px;
    }

    .value{
      font-size:18px;
      font-weight:900;
      white-space:nowrap;
    }

    .service{
      margin:10px 0;
      color:#344054;
      white-space:pre-wrap;
      font-size:14px;
      line-height:1.35;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      border-radius:999px;
      padding:6px 10px;
      font-size:12px;
      font-weight:900;
    }

    .pill.pago{background:#ecfdf3;color:#027a48}
    .pill.aberto{background:#fff7ed;color:#b54708}

    .quick{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .empty{
      text-align:center;
      padding:28px 12px;
      color:var(--muted);
    }

    .bar{
      height:12px;
      border-radius:99px;
      background:#eaecf0;
      overflow:hidden;
      margin:8px 0 12px;
    }

    .fill{
      height:100%;
      background:linear-gradient(90deg,var(--blue),var(--orange));
      border-radius:99px;
    }

    .month-row{
      margin-bottom:12px;
    }

    .month-label{
      display:flex;
      justify-content:space-between;
      font-size:13px;
      font-weight:800;
    }

    .bottom-nav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:20;
      background:white;
      border-top:1px solid var(--line);
      display:grid;
      grid-template-columns:repeat(4,1fr);
      padding:8px 7px max(8px, env(safe-area-inset-bottom));
      box-shadow:0 -8px 24px rgba(16,24,40,.08);
    }

    .nav-btn{
      border:0;
      background:white;
      color:#667085;
      font-size:11px;
      font-weight:900;
      padding:8px 3px;
      border-radius:13px;
      min-height:50px;
    }

    .nav-btn strong{
      display:block;
      font-size:19px;
      line-height:1;
      margin-bottom:4px;
    }

    .nav-btn.active{
      background:#eef4ff;
      color:var(--blue);
    }

    .hidden{display:none!important}

    .print-area{display:none}

    @media(min-width:680px){
      .grid{grid-template-columns:repeat(4,1fr)}
      .metric.full{grid-column:auto}
    }

    @media print{
      body{background:white;padding:0}
      header, main, .bottom-nav{display:none!important}
      .print-area{
        display:block;
        padding:24px;
        color:#111827;
        font-family:Arial, Helvetica, sans-serif;
      }
      .print-header{
        display:flex;
        align-items:center;
        gap:12px;
        border-bottom:2px solid #e5e7eb;
        padding-bottom:14px;
        margin-bottom:18px;
      }
      .print-header img{
        width:70px;
        height:70px;
        object-fit:contain;
      }
      .print-title{
        font-size:26px;
        font-weight:900;
      }
      .print-sub{
        color:#667085;
        margin-top:4px;
      }
      .print-grid{
        display:grid;
        grid-template-columns:1fr 1fr;
        border:1px solid #d0d5dd;
        margin-bottom:18px;
      }
      .print-grid div{
        padding:12px;
        border-bottom:1px solid #d0d5dd;
      }
      .print-grid div:nth-child(odd){
        border-right:1px solid #d0d5dd;
      }
      .print-box{
        border:1px solid #d0d5dd;
        padding:14px;
        min-height:110px;
        margin-bottom:18px;
        white-space:pre-wrap;
      }
      .print-value{
        border:1px solid #d0d5dd;
        background:#f2f4f7;
        padding:14px;
        font-size:26px;
        font-weight:900;
        text-align:right;
        margin-bottom:28px;
      }
      .signs{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:42px;
        margin-top:70px;
      }
      .sign{
        text-align:center;
        border-top:1px solid #111827;
        padding-top:8px;
        color:#475467;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <div class="logo">
        <img src="logo.png" alt="Logo" onload="this.style.display='block';this.nextElementSibling.style.display='none'">
        <span>⚡</span>
      </div>
      <div>
        <h1>Ordens de Serviço</h1>
        <p class="sub">Controle simples para celular</p>
      </div>
    </div>
  </header>

  <main>
    <section id="screen-home" class="screen active">
      <div class="grid">
        <div class="metric">
          <div class="label">Recebido</div>
          <div class="value" id="mRecebido">R$ 0,00</div>
        </div>
        <div class="metric">
          <div class="label">Em aberto</div>
          <div class="value" id="mAberto">R$ 0,00</div>
        </div>
        <div class="metric">
          <div class="label">Total lançado</div>
          <div class="value" id="mTotal">R$ 0,00</div>
        </div>
        <div class="metric">
          <div class="label">OS</div>
          <div class="value" id="mQtd">0</div>
        </div>
      </div>

      <div class="card">
        <div class="title-row">
          <h2>Atalhos</h2>
        </div>
        <div class="quick">
          <button class="btn green" onclick="showScreen('nova')">+ Nova OS</button>
          <button class="btn light" onclick="showScreen('ordens')">Ver ordens</button>
          <button class="btn orange" onclick="showScreen('receber')">Receber</button>
          <button class="btn gray" onclick="backup()">Backup</button>
        </div>
      </div>

      <div class="card">
        <div class="title-row">
          <h2>Entradas por mês</h2>
          <span class="muted">pagas</span>
        </div>
        <div id="months"></div>
      </div>
    </section>

    <section id="screen-ordens" class="screen">
      <div class="card">
        <div class="title-row">
          <h2>Ordens</h2>
          <button class="btn small green" onclick="newOrder()">+ Nova</button>
        </div>
        <input id="search" placeholder="Buscar cliente ou serviço" oninput="render()">
        <div class="row2">
          <div>
            <label>Status</label>
            <select id="filterStatus" onchange="render()">
              <option value="todos">Todos</option>
              <option value="aberto">Em aberto</option>
              <option value="pago">Pago</option>
            </select>
          </div>
          <div>
            <label>Mês</label>
            <input id="filterMonth" type="month" onchange="render()">
          </div>
        </div>
      </div>
      <div id="ordersList"></div>
    </section>

    <section id="screen-nova" class="screen">
      <form class="card" onsubmit="saveOrder(event)">
        <div class="title-row">
          <h2 id="formTitle">Nova OS</h2>
          <button type="button" class="btn small gray" onclick="clearForm()">Limpar</button>
        </div>

        <input type="hidden" id="editId">

        <label>Cliente</label>
        <input id="cliente" required placeholder="Nome do cliente">

        <div class="row2">
          <div>
            <label>Data</label>
            <input id="data" type="date" required>
          </div>
          <div>
            <label>Valor</label>
            <input id="valor" required inputmode="decimal" placeholder="120,00">
          </div>
        </div>

        <label>Serviço</label>
        <textarea id="servico" required placeholder="Ex: Limpeza de inversor"></textarea>

        <label>Observações</label>
        <textarea id="obs" placeholder="Opcional"></textarea>

        <div class="row2">
          <div>
            <label>Status</label>
            <select id="status">
              <option value="aberto">Em aberto</option>
              <option value="pago">Pago</option>
            </select>
          </div>
          <div>
            <label>Pagamento</label>
            <select id="pagamento">
              <option value="">Não informado</option>
              <option>Pix</option>
              <option>Dinheiro</option>
              <option>Cartão</option>
              <option>Transferência</option>
              <option>Boleto</option>
            </select>
          </div>
        </div>

        <label>Técnico</label>
        <input id="tecnico" value="Anderson">

        <div class="actions">
          <button class="btn green block" type="submit">Salvar OS</button>
        </div>
      </form>
    </section>

    <section id="screen-receber" class="screen">
      <div class="card">
        <div class="title-row">
          <h2>A receber</h2>
          <span class="muted" id="aReceberTxt">R$ 0,00</span>
        </div>
        <p class="muted" style="margin-top:0">Toque em “Marcar pago” quando entrar o dinheiro.</p>
      </div>
      <div id="receiveList"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button id="nav-home" class="nav-btn active" onclick="showScreen('home')"><strong>⌂</strong>Início</button>
    <button id="nav-ordens" class="nav-btn" onclick="showScreen('ordens')"><strong>☰</strong>Ordens</button>
    <button id="nav-nova" class="nav-btn" onclick="newOrder()"><strong>＋</strong>Nova</button>
    <button id="nav-receber" class="nav-btn" onclick="showScreen('receber')"><strong>R$</strong>Receber</button>
  </nav>

  <section class="print-area" id="printArea"></section>

  <script>
    const KEY = "os_mobile_anderson_v2";
    let orders = load();
    let currentScreen = "home";

    function defaultOrders(){
      return [
        {id:id(), os:"001", data:"2026-06-11", cliente:"Alan Dalazen", servico:"Serviço técnico executado conforme combinado com o cliente.", obs:"", valor:270, status:"aberto", pagamento:"", tecnico:"Anderson"},
        {id:id(), os:"002", data:"2026-06-11", cliente:"Osmar", servico:"Troca de potenciômetro.", obs:"", valor:80, status:"aberto", pagamento:"", tecnico:"Anderson"},
        {id:id(), os:"003", data:"2026-06-11", cliente:"Imperial Gráfica", servico:"Conserto de dobradeira.", obs:"", valor:600, status:"aberto", pagamento:"", tecnico:"Anderson"},
        {id:id(), os:"004", data:"2026-06-11", cliente:"RGA", servico:"Conserto de máquina de brigadeiro.\nRegulagem de facas.\nResolução de mau contato.", obs:"", valor:190, status:"aberto", pagamento:"", tecnico:"Anderson"},
        {id:id(), os:"005", data:"2026-06-11", cliente:"Diego Novak", servico:"Rebobinagem de transformador.", obs:"", valor:250, status:"aberto", pagamento:"", tecnico:"Anderson"},
        {id:id(), os:"006", data:"2026-08-27", cliente:"", servico:"Conserto/troca de capacitor de placa.", obs:"", valor:120, status:"aberto", pagamento:"", tecnico:"Anderson"},
        {id:id(), os:"007", data:"2026-08-31", cliente:"Daniel Baccin", servico:"Reparo de bomba de lubrificação.\nConserto de trafinho do drive.\nDesmontagem drive-cliq.\nMão de obra, testes de drive e motor.", obs:"Defeitos principais estavam no eixo Z1 e Y1.", valor:2740, status:"aberto", pagamento:"", tecnico:"Anderson"},
        {id:id(), os:"008", data:"2026-09-18", cliente:"Paulo ArFlex", servico:"Limpeza de inversor.", obs:"", valor:250, status:"aberto", pagamento:"", tecnico:"Anderson"}
      ];
    }

    function id(){
      if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return String(Date.now()) + Math.random().toString(16).slice(2);
    }

    function load(){
      try{
        const saved = localStorage.getItem(KEY);
        if(saved) return JSON.parse(saved);
      }catch(e){}
      return defaultOrders();
    }

    function save(){
      localStorage.setItem(KEY, JSON.stringify(orders));
    }

    function showScreen(name){
      currentScreen = name;
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById("screen-" + name).classList.add("active");

      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      const nav = document.getElementById("nav-" + name);
      if(nav) nav.classList.add("active");

      window.scrollTo({top:0, behavior:"smooth"});
      render();
    }

    function newOrder(){
      clearForm();
      showScreen("nova");
    }

    function clearForm(){
      editId.value = "";
      formTitle.textContent = "Nova OS";
      cliente.value = "";
      data.value = new Date().toISOString().slice(0,10);
      valor.value = "";
      servico.value = "";
      obs.value = "";
      status.value = "aberto";
      pagamento.value = "";
      tecnico.value = "Anderson";
    }

    function parseMoney(v){
      if(typeof v === "number") return v;
      return Number(String(v || "").replace(/\./g,"").replace(",",".").replace(/[^\d.-]/g,"")) || 0;
    }

    function money(v){
      return Number(v || 0).toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
    }

    function brDate(s){
      if(!s) return "";
      const [y,m,d] = s.split("-");
      return `${d}/${m}/${y}`;
    }

    function nextOS(){
      const max = Math.max(0, ...orders.map(o => Number(o.os || 0)));
      return String(max + 1).padStart(3, "0");
    }

    function saveOrder(e){
      e.preventDefault();

      const edit = editId.value;
      const old = orders.find(o => o.id === edit);

      const item = {
        id: edit || id(),
        os: edit && old ? old.os : nextOS(),
        data: data.value,
        cliente: cliente.value.trim(),
        servico: servico.value.trim(),
        obs: obs.value.trim(),
        valor: parseMoney(valor.value),
        status: status.value,
        pagamento: pagamento.value,
        tecnico: tecnico.value.trim() || "Anderson"
      };

      if(edit){
        orders = orders.map(o => o.id === edit ? item : o);
      }else{
        orders.push(item);
      }

      save();
      clearForm();
      showScreen("ordens");
    }

    function filtered(){
      const q = (search?.value || "").toLowerCase().trim();
      const st = filterStatus?.value || "todos";
      const month = filterMonth?.value || "";

      return orders.filter(o => {
        const txt = `${o.cliente} ${o.servico} ${o.obs}`.toLowerCase();
        if(q && !txt.includes(q)) return false;
        if(st !== "todos" && o.status !== st) return false;
        if(month && !String(o.data || "").startsWith(month)) return false;
        return true;
      }).sort((a,b) => String(b.os).localeCompare(String(a.os)));
    }

    function render(){
      const total = orders.reduce((s,o)=>s+Number(o.valor||0),0);
      const recebido = orders.filter(o=>o.status==="pago").reduce((s,o)=>s+Number(o.valor||0),0);
      const aberto = total - recebido;

      mRecebido.textContent = money(recebido);
      mAberto.textContent = money(aberto);
      mTotal.textContent = money(total);
      mQtd.textContent = orders.length;
      aReceberTxt.textContent = money(aberto);

      renderMonths();
      renderOrders();
      renderReceive();
      save();
    }

    function renderMonths(){
      const paid = orders.filter(o=>o.status==="pago");
      const group = {};
      paid.forEach(o=>{
        const k = String(o.data || "").slice(0,7) || "Sem data";
        group[k] = (group[k] || 0) + Number(o.valor || 0);
      });

      const rows = Object.entries(group).sort(([a],[b])=>a.localeCompare(b));
      if(!rows.length){
        months.innerHTML = '<div class="empty">Nenhuma OS paga ainda.</div>';
        return;
      }

      const max = Math.max(...rows.map(r=>r[1]),1);
      months.innerHTML = rows.map(([mes,total])=>{
        const label = mes.includes("-") ? mes.split("-").reverse().join("/") : mes;
        const pct = Math.max(4, total / max * 100);
        return `<div class="month-row">
          <div class="month-label"><span>${label}</span><span>${money(total)}</span></div>
          <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
        </div>`;
      }).join("");
    }

    function renderOrders(){
      const list = filtered();
      if(!list.length){
        ordersList.innerHTML = '<div class="empty">Nenhuma OS encontrada.</div>';
        return;
      }
      ordersList.innerHTML = list.map(cardHTML).join("");
    }

    function renderReceive(){
      const list = orders.filter(o=>o.status!=="pago").sort((a,b)=>String(b.os).localeCompare(String(a.os)));
      if(!list.length){
        receiveList.innerHTML = '<div class="empty">Nada em aberto. Tudo pago.</div>';
        return;
      }
      receiveList.innerHTML = list.map(cardHTML).join("");
    }

    function cardHTML(o){
      return `<div class="os-card">
        <div class="os-head">
          <div>
            <div class="os-num">OS ${esc(o.os)} • ${brDate(o.data)}</div>
            <div class="client">${esc(o.cliente || "Sem cliente")}</div>
          </div>
          <div class="value">${money(o.valor)}</div>
        </div>
        <div class="service">${esc(o.servico || "")}${o.obs ? "\n\nObs: " + esc(o.obs) : ""}</div>
        <span class="pill ${o.status}">${o.status === "pago" ? "Pago" : "Em aberto"}</span>
        ${o.pagamento ? `<span class="muted"> • ${esc(o.pagamento)}</span>` : ""}
        <div class="actions">
          <button class="btn small green" onclick="togglePaid('${o.id}')">${o.status === "pago" ? "Reabrir" : "Marcar pago"}</button>
          <button class="btn small light" onclick="editOrder('${o.id}')">Editar</button>
          <button class="btn small gray" onclick="printOrder('${o.id}')">PDF</button>
          <button class="btn small red" onclick="delOrder('${o.id}')">Excluir</button>
        </div>
      </div>`;
    }

    function togglePaid(orderId){
      orders = orders.map(o => o.id === orderId ? {...o, status:o.status==="pago"?"aberto":"pago"} : o);
      render();
    }

    function editOrder(orderId){
      const o = orders.find(x => x.id === orderId);
      if(!o) return;
      editId.value = o.id;
      formTitle.textContent = "Editar OS " + o.os;
      cliente.value = o.cliente || "";
      data.value = o.data || new Date().toISOString().slice(0,10);
      valor.value = String(o.valor || "").replace(".",",");
      servico.value = o.servico || "";
      obs.value = o.obs || "";
      status.value = o.status || "aberto";
      pagamento.value = o.pagamento || "";
      tecnico.value = o.tecnico || "Anderson";
      showScreen("nova");
    }

    function delOrder(orderId){
      const o = orders.find(x => x.id === orderId);
      if(!o) return;
      if(confirm(`Excluir OS ${o.os} - ${o.cliente || "Sem cliente"}?`)){
        orders = orders.filter(x => x.id !== orderId);
        render();
      }
    }

    function printOrder(orderId){
      const o = orders.find(x => x.id === orderId);
      if(!o) return;

      printArea.innerHTML = `
        <div class="print-header">
          <img src="logo.png" onerror="this.style.display='none'">
          <div>
            <div class="print-title">ORDEM DE SERVIÇO</div>
            <div class="print-sub">Assistência técnica em eletromecânica e eletrônica geral</div>
          </div>
        </div>

        <div class="print-grid">
          <div><strong>Cliente:</strong> ${esc(o.cliente || "")}</div>
          <div><strong>Data:</strong> ${brDate(o.data)}</div>
          <div><strong>OS:</strong> ${esc(o.os)}</div>
          <div><strong>Técnico:</strong> ${esc(o.tecnico || "Anderson")}</div>
          <div><strong>Status:</strong> ${o.status === "pago" ? "Pago" : "Em aberto"}</div>
          <div><strong>Pagamento:</strong> ${esc(o.pagamento || "-")}</div>
        </div>

        <h3>DESCRIÇÃO DO SERVIÇO</h3>
        <div class="print-box">${esc(o.servico || "")}</div>

        ${o.obs ? `<h3>OBSERVAÇÕES</h3><div class="print-box">${esc(o.obs)}</div>` : ""}

        <div class="print-value">${money(o.valor)}</div>

        <p>Declaro que o serviço acima foi executado e entregue conforme solicitado.</p>

        <div class="signs">
          <div class="sign">Assinatura do Cliente</div>
          <div class="sign">Assinatura do Técnico</div>
        </div>
      `;
      window.print();
    }

    function backup(){
      const blob = new Blob([JSON.stringify(orders,null,2)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "backup_ordens_servico.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function esc(t){
      return String(t ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    clearForm();
    render();
  </script>
</body>
</html>
